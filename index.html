<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stake Parceiros - Sistema de Gestão</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300E701'/><text x='50' y='70' font-family='Arial, sans-serif' font-weight='bold' font-size='60' fill='black' text-anchor='middle'>S</text></svg>">
    <style>
      #error-display { display: none; padding: 20px; background: #fee; border: 1px solid red; color: red; font-family: monospace; position: absolute; top: 0; left: 0; right: 0; z-index: 9999; }
    </style>
  </head>
  <body class="bg-gray-100 text-slate-900">
    <div id="error-display"></div>
    <script>
      window.addEventListener('error', function(e) {
        var display = document.getElementById('error-display');
        display.style.display = 'block';
        display.innerText = 'JS Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        console.error(e);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var display = document.getElementById('error-display');
        display.style.display = 'block';
        display.innerText = 'Promise Error: ' + e.reason;
        console.error(e);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
